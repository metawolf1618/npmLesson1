  #calendar-boot-loading {
    position: fixed;
    inset: 0;
    z-index: 110;
  }
  #calendar-boot-loading.calendar-boot-loading-hidden {
    display: none;
  }
  .calendar-boot-loading-screen {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    user-select: none;
    -webkit-user-drag: none;
    background: var(--dynamic-back-color-find-time, #fff);
  }
  .calendar-boot-loading-icon {
    width: 200px;
    height: 200px;
  }
  .calendar-boot-loading-section {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .calendar-boot-progress-bar-track {
    position: relative;
    width: 290px;
    height: 3px;
    overflow: hidden;
    background-color: var(--dynamic-color-f1f4f6-444b53, #f1f4f6);
    border-radius: 1.5px;
  }
  .calendar-boot-progress-bar-indicator-1,
  .calendar-boot-progress-bar-indicator-2 {
    position: absolute;
    top: 0;
    bottom: 0;
    border-radius: 1.5px;
    background-color: var(--recording-item-title, #0e72ed);
  }
  .calendar-boot-progress-bar-indicator-1 {
    animation: calendar-boot-loop-progress-bar-1 2.1s cubic-bezier(0.65, 0.815, 0.735, 0.395) infinite;
  }
  .calendar-boot-progress-bar-indicator-2 {
    animation: calendar-boot-loop-progress-bar-2 2.1s cubic-bezier(0.165, 0.84, 0.44, 1) 1.15s infinite;
  }
  .calendar-boot-text-loading {
    padding: 20px;
    font-size: 14px;
    line-height: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--dynamic-color-6e7680, #6e7680);
  }
  .calendar-boot-dots {
    width: 9px;
    display: inline-block;
    vertical-align: bottom;
    overflow: hidden;
    animation: calendar-boot-dot 3s infinite step-start;
  }
  @keyframes calendar-boot-loop-progress-bar-1 {
    0% { right: 100%; left: -35%; }
    60% { right: -90%; left: 100%; }
    100% { right: -90%; left: 100%; }
  }
  @keyframes calendar-boot-loop-progress-bar-2 {
    0% { right: 100%; left: -200%; }
    60% { right: -8%; left: 107%; }
    100% { right: -8%; left: 107%; }
  }
  @keyframes calendar-boot-dot {
    0% { width: 0; margin-right: 9px; }
    33% { width: 3px; margin-right: 6px; }
    66% { width: 6px; margin-right: 3px; }
    100% { width: 9px; margin-right: 0; }
  }
